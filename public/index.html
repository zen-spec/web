<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Downloader</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex; justify-content: center; align-items: center;
    padding: 20px;
  }
  .container {
    background: #fff; border-radius: 20px;
    padding: 30px; max-width: 650px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 { text-align: center; margin-bottom: 8px; color: #333; font-size: 26px; }
  .subtitle { text-align: center; color: #888; margin-bottom: 25px; font-size: 13px; }

  .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .tab {
    flex: 1; padding: 12px; border: none; cursor: pointer;
    background: #f0f0f0; border-radius: 10px;
    font-weight: 600; font-size: 15px; transition: all 0.3s;
  }
  .tab.active {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
  }

  .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
  input {
    flex: 1; padding: 14px; border: 2px solid #e0e0e0;
    border-radius: 10px; font-size: 14px; outline: none;
    transition: border 0.3s;
  }
  input:focus { border-color: #667eea; }

  button.submit {
    padding: 14px 24px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white; border-radius: 10px; font-weight: 600;
    transition: transform 0.2s; font-size: 14px;
  }
  button.submit:hover:not(:disabled) { transform: translateY(-2px); }
  button.submit:disabled { opacity: 0.5; cursor: not-allowed; }

  .loading { text-align: center; padding: 20px; color: #667eea; font-weight: 600; }

  .result {
    margin-top: 20px; padding: 20px;
    background: #f9f9f9; border-radius: 15px;
  }
  .result img {
    width: 100%; max-width: 280px; border-radius: 10px;
    display: block; margin: 0 auto 15px;
  }
  .result h3 { color: #333; margin-bottom: 8px; font-size: 15px; }
  .result p { color: #666; font-size: 13px; margin-bottom: 12px; }

  .format-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .format-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: white; border-radius: 8px;
    border: 1px solid #e0e0e0;
  }
  .format-item span { font-size: 13px; color: #333; font-weight: 500; }
  .format-item a {
    padding: 8px 14px; background: #667eea; color: white;
    text-decoration: none; border-radius: 6px; font-size: 12px;
    transition: background 0.2s; font-weight: 600;
  }
  .format-item a:hover { background: #5568d3; }

  .error {
    padding: 14px; background: #fee; color: #c33;
    border-radius: 10px; margin-top: 15px; font-size: 13px;
  }
  .section-title { color: #444; font-size: 14px; font-weight: 700; margin-top: 15px; }
</style>
</head>
<body>
  <div class="container">
    <h1>🎬 My Downloader</h1>
    <p class="subtitle">Download video YouTube & TikTok</p>

    <div class="tabs">
      <button class="tab active" data-tab="youtube">▶️ YouTube</button>
      <button class="tab" data-tab="tiktok">🎵 TikTok</button>
    </div>

    <div class="input-group">
      <input type="text" id="urlInput" placeholder="Paste link YouTube di sini...">
      <button class="submit" id="submitBtn">Download</button>
    </div>

    <div id="output"></div>
  </div>

<script>
  let currentTab = 'youtube';

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      document.getElementById('urlInput').placeholder =
        currentTab === 'youtube'
          ? 'Paste link YouTube di sini...'
          : 'Paste link TikTok di sini...';
      document.getElementById('output').innerHTML = '';
    });
  });

  document.getElementById('submitBtn').addEventListener('click', process);
  document.getElementById('urlInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') process();
  });

  async function process() {
    const url = document.getElementById('urlInput').value.trim();
    const output = document.getElementById('output');
    const btn = document.getElementById('submitBtn');

    if (!url) return alert('Masukkan URL dulu!');

    btn.disabled = true;
    output.innerHTML = '<div class="loading">⏳ Memproses video...</div>';

    try {
      const res = await fetch(`/api/${currentTab}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await res.json();

      if (!res.ok || data.error) throw new Error(data.error || 'Gagal memproses');
      renderResult(data);
    } catch (err) {
      output.innerHTML = `<div class="error">❌ ${err.message}</div>`;
    } finally {
      btn.disabled = false;
    }
  }

  function renderResult(data) {
    const output = document.getElementById('output');

    if (currentTab === 'youtube') {
      let html = `
        <div class="result">
          <img src="${data.thumbnail}" alt="thumbnail" onerror="this.style.display='none'">
          <h3>${data.title}</h3>
          <p>👤 ${data.author} • ⏱️ ${data.duration} detik</p>
          <div class="section-title">📹 Video + Audio:</div>
          <div class="format-list">
      `;
      data.videoFormats.forEach(f => {
        const dl = `/api/download?url=${encodeURIComponent(f.url)}&filename=video_${f.quality}.mp4`;
        html += `<div class="format-item">
          <span>🎥 ${f.quality}</span>
          <a href="${dl}">⬇️ Download</a>
        </div>`;
      });
      html += `</div><div class="section-title">🎵 Audio Only:</div><div class="format-list">`;
      data.audioFormats.forEach(f => {
        const dl = `/api/download?url=${encodeURIComponent(f.url)}&filename=audio_${f.quality}.m4a`;
        html += `<div class="format-item">
          <span>🎧 ${f.quality}</span>
          <a href="${dl}">⬇️ Download</a>
        </div>`;
      });
      html += `</div></div>`;
      output.innerHTML = html;

    } else {
      const noWm = data.videoUrlNoWatermark || data.videoUrl;
      const wm = data.videoUrl;
      output.innerHTML = `
        <div class="result">
          <img src="${data.thumbnail}" alt="thumbnail" onerror="this.style.display='none'">
          <h3>${data.title}</h3>
          <p>👤 ${data.author}</p>
          <div class="format-list">
            ${noWm ? `<div class="format-item">
              <span>✨ No Watermark</span>
              <a href="/api/download?url=${encodeURIComponent(noWm)}&filename=tiktok_nowm.mp4">⬇️ Download</a>
            </div>` : ''}
            ${wm ? `<div class="format-item">
              <span>💧 With Watermark</span>
              <a href="/api/download?url=${encodeURIComponent(wm)}&filename=tiktok_wm.mp4">⬇️ Download</a>
            </div>` : ''}
          </div>
        </div>
      `;
    }
  }
</script>
</body>
</html>
