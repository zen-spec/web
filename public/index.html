<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Downloader</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex; justify-content: center; align-items: center;
    padding: 20px;
  }
  .container {
    background: #fff; border-radius: 20px;
    padding: 40px; max-width: 700px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 { text-align: center; margin-bottom: 10px; color: #333; }
  .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 14px; }
  
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .tab {
    flex: 1; padding: 12px; border: none; cursor: pointer;
    background: #f0f0f0; border-radius: 10px;
    font-weight: 600; transition: all 0.3s;
  }
  .tab.active {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
  }

  .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
  input {
    flex: 1; padding: 15px; border: 2px solid #e0e0e0;
    border-radius: 10px; font-size: 15px; outline: none;
    transition: border 0.3s;
  }
  input:focus { border-color: #667eea; }
  
  button.submit {
    padding: 15px 30px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white; border-radius: 10px; font-weight: 600;
    transition: transform 0.2s;
  }
  button.submit:hover { transform: translateY(-2px); }
  button.submit:disabled { opacity: 0.5; cursor: not-allowed; }

  .loading { text-align: center; padding: 20px; color: #667eea; }
  
  .result {
    margin-top: 20px; padding: 20px;
    background: #f9f9f9; border-radius: 15px;
  }
  .result img {
    width: 100%; max-width: 300px; border-radius: 10px;
    display: block; margin: 0 auto 15px;
  }
  .result h3 { color: #333; margin-bottom: 10px; font-size: 16px; }
  .result p { color: #666; font-size: 14px; margin-bottom: 15px; }
  
  .format-list { display: flex; flex-direction: column; gap: 8px; }
  .format-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px; background: white; border-radius: 8px;
    border: 1px solid #e0e0e0;
  }
  .format-item span { font-size: 14px; color: #333; }
  .format-item a {
    padding: 8px 16px; background: #667eea; color: white;
    text-decoration: none; border-radius: 6px; font-size: 13px;
    transition: background 0.2s;
  }
  .format-item a:hover { background: #5568d3; }
  
  .error {
    padding: 15px; background: #fee; color: #c33;
    border-radius: 10px; margin-top: 15px; font-size: 14px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>🎬 My Downloader</h1>
    <p class="subtitle">Download video YouTube & TikTok dengan mudah</p>

    <div class="tabs">
      <button class="tab active" data-tab="youtube">▶️ YouTube</button>
      <button class="tab" data-tab="tiktok">🎵 TikTok</button>
    </div>

    <div class="input-group">
      <input type="text" id="urlInput" placeholder="Paste link di sini...">
      <button class="submit" id="submitBtn">Download</button>
    </div>

    <div id="output"></div>
  </div>

<script>
  let currentTab = 'youtube';

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      document.getElementById('urlInput').placeholder =
        currentTab === 'youtube' ? 'https://youtube.com/watch?v=...' : 'https://tiktok.com/@user/video/...';
      document.getElementById('output').innerHTML = '';
    });
  });

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const url = document.getElementById('urlInput').value.trim();
    const output = document.getElementById('output');
    const btn = document.getElementById('submitBtn');

    if (!url) return alert('Masukkan URL dulu!');

    btn.disabled = true;
    output.innerHTML = '<div class="loading">⏳ Memproses...</div>';

    try {
      const res = await fetch(`/api/${currentTab}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await res.json();

      if (data.error) throw new Error(data.error);
      renderResult(data);
    } catch (err) {
      output.innerHTML = `<div class="error">❌ ${err.message}</div>`;
    } finally {
      btn.disabled = false;
    }
  });

  function renderResult(data) {
    const output = document.getElementById('output');

    if (currentTab === 'youtube') {
      let html = `
        <div class="result">
          <img src="${data.thumbnail}" alt="thumbnail">
          <h3>${data.title}</h3>
          <p>👤 ${data.author} • ⏱️ ${data.duration}s</p>
          <h3>📹 Video:</h3>
          <div class="format-list">
      `;
      data.videoFormats.forEach(f => {
        const dlUrl = `/api/download?url=${encodeURIComponent(f.url)}&filename=video_${f.quality}.mp4`;
        html += `<div class="format-item">
          <span>${f.quality} (${f.mimeType.split(';')[0]})</span>
          <a href="${dlUrl}">⬇️ Download</a>
        </div>`;
      });
      html += `</div><h3 style="margin-top:15px">🎵 Audio:</h3><div class="format-list">`;
      data.audioFormats.forEach(f => {
        const dlUrl = `/api/download?url=${encodeURIComponent(f.url)}&filename=audio_${f.quality}.m4a`;
        html += `<div class="format-item">
          <span>${f.quality}</span>
          <a href="${dlUrl}">⬇️ Download</a>
        </div>`;
      });
      html += `</div></div>`;
      output.innerHTML = html;
    } else {
      output.innerHTML = `
        <div class="result">
          <img src="${data.thumbnail}" alt="thumbnail">
          <h3>${data.title || 'TikTok Video'}</h3>
          <p>👤 ${data.author}</p>
          <div class="format-list">
            <div class="format-item">
              <span>💧 With Watermark</span>
              <a href="/api/download?url=${encodeURIComponent(data.videoUrl)}&filename=tiktok_wm.mp4">⬇️ Download</a>
            </div>
            <div class="format-item">
              <span>✨ No Watermark</span>
              <a href="/api/download?url=${encodeURIComponent(data.videoUrlNoWatermark)}&filename=tiktok_nowm.mp4">⬇️ Download</a>
            </div>
          </div>
        </div>
      `;
    }
  }
</script>
</body>
</html>
