<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full space-y-6 text-center">
    <h1 class="text-3xl font-bold tracking-tight">Media Downloader</h1>
    <p class="text-slate-400 text-sm">Unduh video dari TikTok, Instagram, Twitter/X, dll.</p>

    <form id="downloadForm" class="space-y-4">
      <input 
        type="url" 
        id="videoUrl" 
        placeholder="Tempelkan URL video di sini..." 
        required 
        class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      >
      <button 
        type="submit" 
        id="submitBtn"
        class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3 rounded-lg transition"
      >
        Unduh Video
      </button>
    </form>

    <!-- Keterangan Status / Loading -->
    <p id="statusMsg" class="text-sm text-indigo-400 hidden">Memproses link video...</p>

    <!-- Hasil Video -->
    <div id="result" class="hidden p-4 bg-slate-800 rounded-lg border border-slate-700 space-y-3">
      <p class="text-sm text-slate-300 font-medium">Video Berhasil Diproses!</p>
      <a 
        id="downloadBtn" 
        href="#" 
        target="_blank" 
        rel="noopener noreferrer"
        class="block w-full text-center bg-green-600 hover:bg-green-500 font-semibold py-2 rounded-lg transition"
      >
        Simpan Video
      </a>
    </div>
  </div>

  <script>
    document.getElementById('downloadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const urlInput = document.getElementById('videoUrl').value;
      const statusMsg = document.getElementById('statusMsg');
      const resultDiv = document.getElementById('result');
      const downloadBtn = document.getElementById('downloadBtn');
      const submitBtn = document.getElementById('submitBtn');

      statusMsg.classList.remove('hidden');
      resultDiv.classList.add('hidden');
      submitBtn.disabled = true;

      try {
        // Menggunakan Public API Cobalt (Server pengunduh open-source)
        const response = await fetch('https://api.cobalt.tools/api/json', {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            url: urlInput
          })
        });

        const data = await response.json();

        if (data.url) {
          downloadBtn.href = data.url;
          resultDiv.classList.remove('hidden');
        } else if (data.picker) {
          // Jika konten berupa galeri foto/multiple slide
          downloadBtn.href = data.picker[0].url;
          resultDiv.classList.remove('hidden');
        } else {
          alert('Gagal mengambil video. Pastikan link publik dan dapat diakses.');
        }
      } catch (err) {
        alert('Terjadi kesalahan koneksi atau server API sedang sibuk.');
      } finally {
        statusMsg.classList.add('hidden');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
