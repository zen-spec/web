<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaveTube - Download Video</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
        }
        .header { text-align: center; padding: 40px 20px 20px; }
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { color: #a0a0b0; margin-top: 10px; }
        .container { max-width: 700px; margin: 30px auto; padding: 0 20px; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .tab-btn {
            flex: 1; padding: 15px; border: none; border-radius: 12px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.tiktok { background: rgba(255,0,80,0.15); color: #ff0050; border: 2px solid rgba(255,0,80,0.3); }
        .tab-btn.tiktok.active { background: linear-gradient(135deg, #ff0050, #00f2ea); color: #fff; border-color: transparent; }
        .tab-btn.youtube { background: rgba(255,0,0,0.15); color: #ff0000; border: 2px solid rgba(255,0,0,0.3); }
        .tab-btn.youtube.active { background: linear-gradient(135deg, #ff0000, #cc0000); color: #fff; border-color: transparent; }
        
        .input-section {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group input {
            width: 100%; padding: 18px 20px; padding-right: 50px;
            border-radius: 12px; border: 2px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; outline: none;
        }
        .input-group input:focus { border-color: #48dbfb; }
        .paste-btn {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: rgba(72,219,251,0.2); border: none; color: #48dbfb;
            padding: 8px 12px; border-radius: 8px; cursor: pointer;
        }
        
        .download-btn {
            width: 100%; padding: 18px; border: none; border-radius: 12px;
            font-size: 1.1rem; font-weight: 700; cursor: pointer; color: #fff;
        }
        .download-btn.tiktok-btn { background: linear-gradient(135deg, #ff0050, #00f2ea); }
        .download-btn.youtube-btn { background: linear-gradient(135deg, #ff0000, #cc0000); }
        .download-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .loading { display: none; text-align: center; padding: 30px; }
        .loading.show { display: block; }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #48dbfb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .result {
            display: none; margin-top: 25px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px; padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .result.show { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .result img {
            width: 100%; max-height: 300px; object-fit: cover;
            border-radius: 12px; margin-bottom: 15px;
        }
        .result h3 { margin-bottom: 10px; font-size: 1.1rem; }
        .result p { color: #a0a0b0; font-size: 0.9rem; margin-bottom: 15px; }
        
        .dl-btn {
            display: block; width: 100%; padding: 15px;
            background: linear-gradient(135deg, #48dbfb, #0abde3);
            color: #fff; text-decoration: none; text-align: center;
            border-radius: 10px; font-weight: 700; margin-bottom: 10px;
            transition: all 0.3s;
        }
        .dl-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .dl-btn.secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        
        .notification {
            position: fixed; top: 20px; right: 20px;
            padding: 15px 25px; border-radius: 10px;
            background: rgba(72,219,251,0.9); color: #fff; font-weight: 600;
            transform: translateX(400px); transition: all 0.4s; z-index: 1000;
        }
        .notification.show { transform: translateX(0); }
        .notification.error { background: rgba(255,71,87,0.9); }
        .notification.success { background: rgba(46,213,115,0.9); }
    </style>
</head>
<body>

<div class="notification" id="notification"></div>

<div class="header">
    <h1>⚡ SaveTube</h1>
    <p>Download video TikTok & YouTube GRATIS (tanpa watermark!)</p>
</div>

<div class="container">
    <div class="tabs">
        <button class="tab-btn tiktok active" onclick="switchTab('tiktok')">🎵 TikTok</button>
        <button class="tab-btn youtube" onclick="switchTab('youtube')">▶️ YouTube</button>
    </div>

    <div class="input-section">
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Tempel link TikTok di sini...">
            <button class="paste-btn" onclick="pasteFromClipboard()">📋</button>
        </div>
        <button class="download-btn tiktok-btn" id="downloadBtn" onclick="processDownload()">
            ⬇️ Proses & Download
        </button>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Sedang mengambil link download...</p>
    </div>

    <div class="result" id="result"></div>
</div>

<script>
    let currentTab = 'tiktok';

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.tab-btn.${tab}`).classList.add('active');
        
        const input = document.getElementById('urlInput');
        const btn = document.getElementById('downloadBtn');
        
        if (tab === 'tiktok') {
            input.placeholder = 'Tempel link TikTok di sini...';
            btn.className = 'download-btn tiktok-btn';
        } else {
            input.placeholder = 'Tempel link YouTube di sini...';
            btn.className = 'download-btn youtube-btn';
        }
        document.getElementById('result').classList.remove('show');
    }

    async function pasteFromClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById('urlInput').value = text;
            showNotification('Link ditempel!', 'success');
        } catch {
            showNotification('Gagal baca clipboard, tempel manual ya', 'error');
        }
    }

    async function processDownload() {
        const url = document.getElementById('urlInput').value.trim();
        if (!url) return showNotification('Masukkan link dulu!', 'error');

        if (currentTab === 'tiktok') {
            await downloadTikTok(url);
        } else {
            await downloadYouTube(url);
        }
    }

    // ========== TIKTOK: Pakai API tikwm.com (GRATIS, no API key) ==========
    async function downloadTikTok(url) {
        showLoading(true);
        try {
            const response = await fetch('https://www.tikwm.com/api/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'url=' + encodeURIComponent(url) + '&hd=1'
            });
            const data = await response.json();

            if (data.code !== 0 || !data.data) {
                throw new Error(data.msg || 'Gagal memproses video');
            }

            const video = data.data;
            const result = document.getElementById('result');
            result.innerHTML = `
                <img src="https://www.tikwm.com${video.cover}" alt="thumbnail">
                <h3>${video.title || 'TikTok Video'}</h3>
                <p>👤 ${video.author?.unique_id || 'Unknown'} • ❤️ ${formatNumber(video.digg_count)} likes • ▶️ ${formatNumber(video.play_count)} views</p>
                <a href="https://www.tikwm.com${video.hdplay || video.play}" class="dl-btn" target="_blank" download>
                    ⬇️ Download Video HD (Tanpa Watermark)
                </a>
                <a href="https://www.tikwm.com${video.play}" class="dl-btn secondary" target="_blank" download>
                    ⬇️ Download Video (Kualitas Biasa)
                </a>
                <a href="https://www.tikwm.com${video.music}" class="dl-btn secondary" target="_blank" download>
                    🎵 Download Audio MP3
                </a>
            `;
            result.classList.add('show');
            showNotification('Video siap download! Klik tombol di atas 👆', 'success');
        } catch (err) {
            showNotification('Error: ' + err.message, 'error');
        } finally {
            showLoading(false);
        }
    }

    // ========== YOUTUBE: Redirect ke layanan downloader ==========
    async function downloadYouTube(url) {
        // Validasi URL YouTube
        if (!url.match(/(youtube\.com|youtu\.be)/)) {
            return showNotification('Link YouTube tidak valid!', 'error');
        }

        showLoading(true);
        try {
            // Coba pakai cobalt API (gratis, open source)
            const response = await fetch('https://api.cobalt.tools/api/json', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    url: url,
                    vCodec: 'h264',
                    vQuality: '1080',
                    aFormat: 'mp3',
                    isAudioOnly: false
                })
            });
            const data = await response.json();

            if (data.status === 'error') {
                throw new Error(data.text || 'Gagal memproses');
            }

            if (data.url) {
                const result = document.getElementById('result');
                result.innerHTML = `
                    <h3>🎬 YouTube Video</h3>
                    <p>Link download berhasil dibuat! Klik tombol di bawah untuk download:</p>
                    <a href="${data.url}" class="dl-btn" target="_blank" download>
                        ⬇️ Download Video YouTube
                    </a>
                    <p style="margin-top: 15px; font-size: 0.85rem; text-align: center;">
                        💡 Jika link tidak bisa, coba alternatif di bawah:
                    </p>
                    <a href="https://www.y2mate.com/youtube/${extractYTId(url)}" class="dl-btn secondary" target="_blank">
                        🔄 Buka di Y2Mate (Alternatif)
                    </a>
                    <a href="https://ssyoutube.com/watch?v=${extractYTId(url)}" class="dl-btn secondary" target="_blank">
                        🔄 Buka di SSYouTube (Alternatif)
                    </a>
                `;
                result.classList.add('show');
                showNotification('Link download siap!', 'success');
            }
        } catch (err) {
            // Fallback: redirect ke y2mate
            const ytId = extractYTId(url);
            const result = document.getElementById('result');
            result.innerHTML = `
                <h3>🎬 YouTube Video</h3>
                <p>API utama sedang sibuk. Gunakan layanan alternatif:</p>
                <a href="https://www.y2mate.com/youtube/${ytId}" class="dl-btn" target="_blank">
                    ⬇️ Download via Y2Mate
                </a>
                <a href="https://ssyoutube.com/watch?v=${ytId}" class="dl-btn secondary" target="_blank">
                    ⬇️ Download via SSYouTube
                </a>
                <a href="https://yt1s.com/youtube-to-mp4?q=${encodeURIComponent(url)}" class="dl-btn secondary" target="_blank">
                    ⬇️ Download via YT1s
                </a>
            `;
            result.classList.add('show');
            showNotification('Pakai alternatif ya, API utama sibuk', 'error');
        } finally {
            showLoading(false);
        }
    }

    function extractYTId(url) {
        const match = url.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
        return match ? match[1] : '';
    }

    function formatNumber(num) {
        if (!num) return '0';
        if (num >= 1000000) return (num/1000000).toFixed(1) + 'M';
        if (num >= 1000) return (num/1000).toFixed(1) + 'K';
        return num;
    }

    function showLoading(show) {
        document.getElementById('loading').classList.toggle('show', show);
        document.getElementById('result').classList.remove('show');
        document.getElementById('downloadBtn').disabled = show;
    }

    function showNotification(msg, type = 'info') {
        const notif = document.getElementById('notification');
        notif.textContent = msg;
        notif.className = 'notification ' + type + ' show';
        setTimeout(() => notif.classList.remove('show'), 3500);
    }

    document.getElementById('urlInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') processDownload();
    });
</script>

</body>
</html>
